[tool.vercel]
entrypoint = "cinesense/api/server.py"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cinesense"
version = "2.0.0"
description = "AI-powered movie & series sentiment analysis toolkit"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "scikit-learn>=1.3.0",
    "joblib>=1.3.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "python-dotenv>=1.0.0",
    "nltk>=3.8.0",
    "colorama>=0.4.6",
    "aiohttp>=3.9.0",
    "cloudscraper>=1.2.0"
]
